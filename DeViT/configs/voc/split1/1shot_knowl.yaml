_BASE_: "../../Base-RCNN-C4.yaml"
DE:
  CLASS_PROTOTYPES: "datasets/voc_base1.pth,datasets/voc_prototype/voc_split1-1shot.pth"
  BG_PROTOTYPES: "weights/initial/background/background_prototypes.vitl14.pth"
  BG_CLS_LOSS_WEIGHT: 0.01
  TOPK: 10

MODEL:
  META_ARCHITECTURE: "OpenSetDetectorWithKnowledge"
  BACKBONE:
    NAME: "build_dino_v2_vit"
    TYPE: "large" # base, small
  WEIGHTS: "" 
  MASK_ON: False
  RPN:
    HEAD_NAME: StandardRPNHead
    IN_FEATURES: ["res4"]
  ROI_HEADS:
    SCORE_THRESH_TEST: 0.001
  ROI_BOX_HEAD:
    NAME: ""
    NUM_FC: 0
    POOLER_RESOLUTION: 7
    CLS_AGNOSTIC_BBOX_REG: True
  PIXEL_MEAN: [0.48145466, 0.4578275, 0.40821073]
  PIXEL_STD: [0.26862954, 0.26130258, 0.27577711]
INPUT:
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800)
DATASETS:
  TRAIN: ("voc_split1_1",)
  TEST: ("voc_test1",)
TEST:
  EVAL_PERIOD: 50
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.00025
  STEPS: (600, )
  MAX_ITER: 800
  WARMUP_ITERS: 10
  CHECKPOINT_PERIOD: 50

INPUT:
  MIN_SIZE_TRAIN_SAMPLING: choice
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800)
  MAX_SIZE_TRAIN: 1333
  MIN_SIZE_TEST: 800
  MAX_SIZE_TEST: 1333
  FORMAT: "RGB"

KGC:
  SHOTS: 1
  CONTAINER: 1
  FEATURE_DIM: 128
  KNOWLEDGE_MATRIX: "KnowledgeMatrix/vision_relationship/split1/cluster_5_replace_gt.npy"
  TAU: 0.5
  COEF: 0.0001