_BASE_: "../Base-RCNN.yaml"
MODEL:
  META_ARCHITECTURE: "GeneralizedRCNNBase"
  WEIGHTS: "ImageNetPretrained/MSRA/R-101.pkl"
  MASK_ON: False
  RESNETS:
    DEPTH: 101
  RPN:
    ENABLE_DECOUPLE: True
    BACKWARD_SCALE: 0.0
  ROI_HEADS:
    NUM_CLASSES: 800
    ENABLE_DECOUPLE: True
    BACKWARD_SCALE: 0.75
    NAME: "Res5ROIHeads"
    OUTPUT_LAYER: "FastRCNNOutputLayers"
    MEMORY: False
DATASETS:
  TRAIN: ('fsod_train_set_base',)
  TEST: ('fsod_train_set_base',)
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.01
  STEPS: (56000, )
  MAX_ITER: 120000
  CHECKPOINT_PERIOD: 10000
TEST:
  PCB_ENABLE: False
  EVAL_PERIOD: 10000
OUTPUT_DIR: "/Path/to/Output/Dir"