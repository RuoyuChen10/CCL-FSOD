_BASE_: "../Base-RCNN-FPN.yaml"
MODEL:
  WEIGHTS: "checkpoints/voc/faster_rcnn2/model_reset_surgery.pth"
  MASK_ON: False
  RESNETS:
    DEPTH: 101
  ROI_HEADS:
    NUM_CLASSES: 20
    OUTPUT_LAYER: "CosineSimOutputLayers"
    FREEZE_FEAT: False
    # IOU_THRESHOLDS: [0.4]
    BATCH_SIZE_PER_IMAGE: 256
  BACKBONE:
    FREEZE: False
    FREEZE_AT: 5
  PROPOSAL_GENERATOR:
    FREEZE: False
INPUT:
  MIN_SIZE_TRAIN: (480, 512, 544, 576, 608, 640, 672, 704, 736, 768, 800)
  MIN_SIZE_TEST: 800
  CROP:
     ENABLED: True
DATASETS:
  TRAIN: ('voc_2007_trainval_all2_5shot',)
  TEST: ('voc_2007_test_all2',)
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.001
  STEPS: (5000,7000)
  MAX_ITER: 9000
  CHECKPOINT_PERIOD: 500
  GAMMA: 0.5
  WARMUP_ITERS: 200
TEST:
  AUG:
    ENABLED: False
  EVAL_PERIOD: 500
SEED: 1
OUTPUT_DIR: "checkpoints/voc/ExAu/ExAu-split2-5shot/"
KNOWLEDGE: True
KNOWLEDGE_MATRIX: "knowledge_matrix/vision_relationship/split2/cluster_5_replace_gt.npy"
CLUSTER: True
TAU: 0.2
SHOT: 5
NORM_MATRIX: "linear"  # [linear, exp, no]
BANK_CONTAINER: 4
COUNTERFACTUAL:
  OPERATOR: True
  START_ITER: 10
  ERASE_THRESHOLD: 0.8
  VISUALIZATION: True
  COUNTER_NUMBER: 3
  ERASE_RATE: 0.05
  ERASE_METHOD: "random"
LAMBDA1: 1.
LAMBDA2: 2.
LAMBDA3: 2.